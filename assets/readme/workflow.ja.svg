<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">UniVault のデータフロー</title>
  <desc id="flowDesc">Ed と Moodle のアーカイブを univault-normalize が統合し、AI とローカル検索で使える 1 つの univault.jsonl を生成します。アイコン：Lucide（ISC）。</desc>

  <!-- Icons: Lucide (ISC) — https://lucide.dev -->
  <rect width="1200" height="280" fill="#000000"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- card 1: Ed -->
    <rect x="64" y="52" width="244" height="176" rx="18" fill="#1C1C1E"/>
    <g stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <svg x="88" y="76" width="26" height="26" viewBox="0 0 24 24">
        <path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        <path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/>
      </svg>
    </g>
    <text x="88" y="132" font-size="22" font-weight="600" fill="#FFFFFF">Ed スレッド</text>
    <text x="88" y="158" font-size="17" fill="#EBEBF5" opacity="0.6">投稿・回答</text>
    <text x="88" y="182" font-size="17" fill="#EBEBF5" opacity="0.6">Lessons・PDF</text>
    <text x="88" y="206" font-size="15" font-weight="500" fill="#0A84FF">API トークン</text>

    <!-- card 2: Moodle -->
    <rect x="340" y="52" width="244" height="176" rx="18" fill="#1C1C1E"/>
    <g stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <svg x="364" y="76" width="26" height="26" viewBox="0 0 24 24">
        <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
        <path d="M22 10v6"/>
        <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
      </svg>
    </g>
    <text x="364" y="132" font-size="22" font-weight="600" fill="#FFFFFF">Moodle</text>
    <text x="364" y="158" font-size="17" fill="#EBEBF5" opacity="0.6">ファイル・ページ</text>
    <text x="364" y="182" font-size="17" fill="#EBEBF5" opacity="0.6">通知・締切</text>
    <text x="364" y="206" font-size="15" font-weight="500" fill="#30D158">スキャン→同期</text>

    <!-- card 3: Normalize -->
    <rect x="616" y="52" width="244" height="176" rx="18" fill="#1C1C1E"/>
    <g stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <svg x="640" y="76" width="26" height="26" viewBox="0 0 24 24">
        <circle cx="18" cy="18" r="3"/>
        <circle cx="6" cy="6" r="3"/>
        <path d="M6 21V9a9 9 0 0 0 9 9"/>
      </svg>
    </g>
    <text x="640" y="132" font-size="22" font-weight="600" fill="#FFFFFF">正規化</text>
    <text x="640" y="158" font-size="17" fill="#EBEBF5" opacity="0.6">統合・重複排除</text>
    <text x="640" y="182" font-size="17" fill="#EBEBF5" opacity="0.6">ひとつの形式</text>
    <text x="640" y="206" font-size="15" font-weight="500" fill="#0A84FF">内容ハッシュ</text>

    <!-- card 4: JSONL -->
    <rect x="892" y="52" width="244" height="176" rx="18" fill="#1C1C1E"/>
    <g stroke="#FF9F0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <svg x="916" y="76" width="26" height="26" viewBox="0 0 24 24">
        <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/>
        <path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>
      </svg>
    </g>
    <text x="916" y="132" font-size="22" font-weight="600" fill="#FFFFFF">univault.jsonl</text>
    <text x="916" y="158" font-size="17" fill="#EBEBF5" opacity="0.6">ローカルコーパス</text>
    <text x="916" y="182" font-size="17" fill="#EBEBF5" opacity="0.6">バージョン履歴</text>
    <text x="916" y="206" font-size="15" font-weight="500" fill="#FF9F0A">AI + grep / jq</text>

    <!-- chevrons -->
    <g fill="#636366" font-size="34">
      <text x="314" y="148">›</text>
      <text x="590" y="148">›</text>
      <text x="866" y="148">›</text>
    </g>
  </g>
</svg>
