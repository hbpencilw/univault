<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">UniVault app icon</title>
  <desc id="logoDesc">Rounded-square app icon: a white graduation cap inside a blue vault ring, with a blue tassel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C2E"/>
      <stop offset="0.65" stop-color="#111113"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64D2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <circle cx="256" cy="252" r="140" fill="none" stroke="url(#ring)" stroke-width="22"/>
  <path d="M256 180 L356 226 L256 272 L156 226 Z" fill="#F2F2F7"/>
  <path d="M206 258 V298 Q206 312 220 312 H292 Q306 312 306 298 V258 Z" fill="#F2F2F7"/>
  <line x1="356" y1="226" x2="356" y2="298" stroke="#0A84FF" stroke-width="8" stroke-linecap="round"/>
  <circle cx="356" cy="306" r="8" fill="#0A84FF"/>
</svg>
